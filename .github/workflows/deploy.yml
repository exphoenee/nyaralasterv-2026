name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A GITHUB_TOKEN jogosultságai a Pages deployhoz
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy deploy fusson; a folyamatban lévőt ne szakítsa meg
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # A repo gyökerét töltjük fel (itt van az index.html)
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
